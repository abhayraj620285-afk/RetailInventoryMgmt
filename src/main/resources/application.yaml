spring:
  application:
    name: inventory
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO}
    show-sql: ${SHOW_SQL}

jwt:
  # No default on purpose: the app refuses to start unless JWT_SECRET is set.
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS}